<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versículo Diario e Imagen por IA</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a24;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #252533;
      border: 1px solid #3d3d52;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #1f1f2b;
      border-bottom: 1px solid #3d3d52;
    }
    .app-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #a0a0c0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-config {
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-config:hover {
      background: #3d3d52;
    }
    .imagen-container {
      position: relative;
    }
    .imagen-container img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }
    .overlay-texto {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .versiculo-imagen {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .referencia-imagen {
      font-size: 0.95rem;
      color: #e0e0e0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .version-tag {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 10px;
      border-radius: 10px;
      margin-top: 8px;
      font-weight: bold;
    }
    .contenido {
      padding: 24px;
      text-align: center;
    }
    .btn-devocional {
      background: #2b6cb0;
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-devocional:hover {
      background: #2c5282;
    }
    .reflexion-box {
      margin-top: 20px;
      padding: 18px;
      background: #1a1a24;
      border-left: 4px solid #2b6cb0;
      border-radius: 4px;
      text-align: left;
      display: none;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #dcdcdc;
    }

    /* Panel de Configuración Modal */
    .config-panel {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #252533;
      z-index: 10;
      padding: 24px;
      box-sizing: border-box;
      text-align: left;
    }
    .config-panel h3 {
      margin-top: 0;
      color: #fff;
      border-bottom: 1px solid #3d3d52;
      padding-bottom: 12px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: #a0a0c0;
      margin-bottom: 8px;
    }
    .form-group select, .form-group input[type="time"] {
      width: 100%;
      padding: 10px;
      background: #1a1a24;
      border: 1px solid #4a5568;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .btn-guardar {
      background: #2b6cb0;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-guardar:hover {
      background: #2c5282;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Barra Superior -->
    <div class="top-bar">
      <span class="app-title">Palabra Diaria</span>
      <button class="btn-config" onclick="abrirConfiguracion()" title="Configuración">⚙️</button>
    </div>

    <!-- Imagen con Versículo Incrustado -->
    <div class="imagen-container">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Versículo tipográfico diario">
      <div class="overlay-texto">
        <p class="versiculo-imagen" id="textoVersiculo">"Santifícalos en tu verdad; tu palabra es verdad."</p>
        <p class="referencia-imagen" id="refVersiculo">Juan 17:17</p>
        <span class="version-tag" id="tagVersion">RVR1960</span>
      </div>
    </div>
    
    <div class="contenido">
      <button class="btn-devocional" onclick="obtenerPensamientoDevocional()">Pensamiento Devocional</button>
      <div id="reflexion" class="reflexion-box"></div>
    </div>

    <!-- Modal de Configuración -->
    <div id="panelConfig" class="config-panel">
      <h3>⚙️ Configuración</h3>
      
      <div class="form-group">
        <label for="selectVersion">Traducción Bíblica Preferida:</label>
        <select id="selectVersion">
          <option value="RVR1960">Reina-Valera 1960 (RVR1960)</option>
          <option value="NBLA">Nueva Biblia de las Américas (NBLA)</option>
          <option value="NTV">Nueva Traducción Viviente (NTV)</option>
          <option value="RVC">Reina Valera Contemporánea (RVC)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="inputHorario">Horario de Notificación Diaria:</label>
        <input type="time" id="inputHorario" value="07:00">
      </div>

      <button class="btn-guardar" onclick="guardarConfiguracion()">Guardar y Cerrar</button>
    </div>
  </div>

  <script>
    // Base de datos local de traducciones para Juan 17:17
    const traduccionesBiblicas = {
      RVR1960: '"Santifícalos en tu verdad; tu palabra es verdad."',
      NBLA: '"Santifícalos en la verdad; Tu palabra es verdad."',
      NTV: '"Hazlos santos con tu verdad; enséñales tu palabra, la cual es verdad."',
      RVC: '"Santifícalos en tu verdad; tu palabra es verdad."'
    };

    function abrirConfiguracion() {
      document.getElementById('panelConfig').style.display = 'block';
    }

    function guardarConfiguracion() {
      const version = document.getElementById('selectVersion').value;
      const horario = document.getElementById('inputHorario').value;
      
      // 1. Actualiza el texto según la versión elegida
      document.getElementById('textoVersiculo').innerText = traduccionesBiblicas[version];
      
      // 2. Actualiza la etiqueta de versión
      document.getElementById('tagVersion').innerText = version;
      
      // 3. Cierra el panel
      document.getElementById('panelConfig').style.display = 'none';

      // Solicitar permiso de notificaciones si no se ha otorgado
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission();
      }
    }

    function obtenerPensamientoDevocional() {
      const box = document.getElementById('reflexion');
      box.style.display = 'block';
      box.innerHTML = '<em>Generando pensamiento devocional...</em>';
      
      setTimeout(() => {
        box.innerHTML = '<strong>Pensamiento Devocional:</strong> Antes de ir a la cruz, Jesús oró pidiéndole al Padre que guarde y aparte a sus seguidores del mal. La verdadera transformación de nuestra vida no depende de nuestras propias fuerzas o de ideas humanas, sino de conocer y obedecer lo que Dios ha dicho en su Palabra. Cuando leemos la Biblia con respeto y le permitimos guiar nuestras decisiones diarias, Dios nos moldea para vivir de una manera que le agrada.';
      }, 700);
    }
  </script>

</body>
</html>
