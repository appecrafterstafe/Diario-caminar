<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Palabra Diaria</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #0a0a12;
      --surface-dark: #141422;
      --accent-blue: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --glass-bg: rgba(0, 0, 0, 0.55);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #f9fafb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      background: var(--surface-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 500px) {
      .app-container {
        height: 92vh;
        max-height: 860px;
        border-radius: 36px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      }
    }

    .top-bar {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 10;
    }

    .app-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
    }

    .hero-section {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 30px;
      text-align: center;
      background-size: cover;
      background-position: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .verse-text {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .verse-ref {
      font-size: 1rem;
      font-weight: 800;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .bottom-section {
      position: relative;
      z-index: 3;
      padding: 16px 20px 24px 20px;
      background: var(--surface-dark);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-buttons-row {
      display: flex;
      gap: 10px;
    }

    .btn-devocional {
      flex: 1;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }

    .btn-share {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .reflexion-box {
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-blue);
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #d1d5db;
      display: none;
      max-height: 140px;
      overflow-y: auto;
    }
  </style>
</head>
<body onload="cargarPlacaDelDia()">

  <div class="app-container">
    <div class="top-bar">
      <span class="app-title">Palabra Diaria</span>
      <button class="btn-share" style="padding: 10px; border-radius: 50%;" onclick="compartirPlaca()">🔗</button>
    </div>

    <div class="hero-section" id="heroSection">
      <div class="hero-overlay"></div>
      <div class="card-content" id="cardContent">
        <p class="verse-text" id="verseText">Cargando versículo...</p>
        <span class="verse-ref" id="verseRef"></span>
      </div>
    </div>

    <div class="bottom-section">
      <div class="action-buttons-row">
        <button class="btn-devocional" onclick="toggleDevocional()">Pensamiento Devocional</button>
        <button class="btn-share" onclick="compartirPlaca()">Compartir Placa</button>
      </div>
      <div id="reflexion" class="reflexion-box"></div>
    </div>
  </div>

  <script>
    let devocionalTexto = "";

    async function cargarPlacaDelDia() {
      try {
        const res = await fetch('/api/generar-placa');
        const data = await res.json();
        
        if (data.exito) {
          document.getElementById('verseText').innerText = `"${data.versiculo}"`;
          document.getElementById('verseRef').innerText = data.referencia;
          document.getElementById('heroSection').style.backgroundImage = `url('${data.imagenFondoUrl}')`;
          devocionalTexto = data.devocional;
        }
      } catch (err) {
        console.error("Error al cargar la placa:", err);
        document.getElementById('verseText').innerText = "No se pudo cargar el versículo de hoy.";
      }
    }

    function toggleDevocional() {
      const box = document.getElementById('reflexion');
      if (box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
        box.innerHTML = `<strong>Pensamiento Devocional:</strong> ${devocionalTexto || 'Cargando mensaje...'}`;
      }
    }

    async function compartirPlaca() {
      const elemento = document.getElementById('heroSection');

      try {
        const canvas = await html2canvas(elemento, { useCORS: true, scale: 2 });
        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'placa-palabra-diaria.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: 'Palabra Diaria',
              text: 'Te comparto el versículo de hoy.',
              files: [file]
            });
          } else {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'placa-palabra-diaria.png';
            a.click();
          }
        }, 'image/png');
      } catch (err) {
        console.error('Error al compartir la placa:', err);
        alert('No se pudo generar la imagen para compartir.');
      }
    }
  </script>

</body>
</html>
