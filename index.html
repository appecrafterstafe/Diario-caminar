<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palabra Diaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1e2e 0%, #0f0f17 100%);
      --card-bg: rgba(25, 25, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-color: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--card-border);
    }

    .app-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .btn-config {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-config:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(30deg);
    }

    .imagen-container {
      position: relative;
      overflow: hidden;
    }

    .imagen-container img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .overlay-texto {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 15, 23, 0.95) 0%, rgba(15, 15, 23, 0.4) 60%, rgba(0,0,0,0.2) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .versiculo-imagen {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.5;
      margin-bottom: 12px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .referencia-imagen {
      font-size: 0.85rem;
      color: #60a5fa;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .version-tag {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.12);
      color: #d1d5db;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .contenido {
      padding: 24px;
      text-align: center;
    }

    .btn-devocional {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 16px 24px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
      transition: all 0.2s ease;
    }

    .btn-devocional:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    .reflexion-box {
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-left: 4px solid #3b82f6;
      border-radius: 12px;
      text-align: left;
      display: none;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #e5e7eb;
    }

    .config-panel {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 23, 0.98);
      z-index: 10;
      padding: 32px 24px;
      text-align: left;
    }

    .config-panel h3 {
      margin-top: 0;
      color: #fff;
      font-size: 1.25rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .form-group select, .form-group input[type="time"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .btn-guardar {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      width: 100%;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="top-bar">
      <span class="app-title">Palabra Diaria</span>
      <button class="btn-config" onclick="abrirConfiguracion()" title="Configuración">⚙️</button>
    </div>

    <div class="imagen-container">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Versículo diario">
      <div class="overlay-texto">
        <p class="versiculo-imagen" id="textoVersiculo">"Santifícalos en tu verdad; tu palabra es verdad."</p>
        <p class="referencia-imagen" id="refVersiculo">Juan 17:17</p>
        <span class="version-tag" id="tagVersion">RVR1960</span>
      </div>
    </div>
    
    <div class="contenido">
      <button class="btn-devocional" onclick="obtenerPensamientoDevocional()">Pensamiento Devocional</button>
      <div id="reflexion" class="reflexion-box"></div>
    </div>

    <div id="panelConfig" class="config-panel">
      <h3>⚙️ Ajustes</h3>
      
      <div class="form-group">
        <label for="selectVersion">Traducción Bíblica Preferida</label>
        <select id="selectVersion">
          <option value="RVR1960">Reina-Valera 1960 (RVR1960)</option>
          <option value="NBLA">Nueva Biblia de las Américas (NBLA)</option>
          <option value="NTV">Nueva Traducción Viviente (NTV)</option>
          <option value="RVC">Reina Valera Contemporánea (RVC)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="inputHorario">Horario de Notificación Diaria</label>
        <input type="time" id="inputHorario" value="07:00">
      </div>

      <button class="btn-guardar" onclick="guardarConfiguracion()">Guardar y Cerrar</button>
    </div>
  </div>

  <script>
    function abrirConfiguracion() {
      document.getElementById('panelConfig').style.display = 'block';
    }

    function guardarConfiguracion() {
      const version = document.getElementById('selectVersion').value;
      document.getElementById('tagVersion').innerText = version;
      document.getElementById('panelConfig').style.display = 'none';

      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission();
      }
      obtenerPensamientoDevocional();
    }

    async function obtenerPensamientoDevocional() {
      const box = document.getElementById('reflexion');
      box.style.display = 'block';
      box.innerHTML = '<em>Cargando pensamiento devocional...</em>';

      try {
        const respuesta = await fetch('/api/daily-verse');
        const datos = await respuesta.json();
        
        if (datos && datos.contenido) {
          const versionActual = document.getElementById('tagVersion').innerText;
          document.getElementById('textoVersiculo').innerText = datos.contenido.traducciones[versionActual] || datos.contenido.traducciones['RVR1960'];
          document.getElementById('refVersiculo').innerText = datos.contenido.referencia;
          box.innerHTML = `<strong>Pensamiento Devocional:</strong> ${datos.contenido.devocional}`;
        }
      } catch (error) {
        box.innerHTML = '<strong>Pensamiento Devocional:</strong> Antes de ir a la cruz, Jesús oró pidiéndole al Padre que guarde y aparte a sus seguidores del mal. La verdadera transformación de nuestra vida no depende de nuestras propias fuerzas o de ideas humanas, sino de conocer y obedecer lo que Dios ha dicho en su Palabra.';
      }
    }
  </script>

</body>
</html>
