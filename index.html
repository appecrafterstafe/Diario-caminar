<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Palabra Diaria</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0a12;
      --surface-dark: #141422;
      --accent-blue: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      background: var(--surface-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (min-width: 500px) {
      .app-container {
        height: 92vh;
        max-height: 860px;
        border-radius: 36px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      }
    }

    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 0);
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    .app-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn-icon:active {
      transform: scale(0.9);
    }

    .hero-section {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    .placa-imagen {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom-section {
      position: relative;
      z-index: 3;
      padding: 16px 20px 24px 20px;
      background: var(--surface-dark);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-buttons-row {
      display: flex;
      gap: 10px;
    }

    .btn-devocional {
      flex: 1;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }

    .btn-share {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .reflexion-box {
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-blue);
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #d1d5db;
      display: none;
      max-height: 140px;
      overflow-y: auto;
    }
  </style>
</head>
<body onload="cargarPlacaDelDia()">

  <div class="app-container">
    <div class="top-bar">
      <span class="app-title">Palabra Diaria</span>
      <div class="header-actions">
        <button class="btn-icon" onclick="compartirPlaca()" title="Compartir Placa">🔗</button>
      </div>
    </div>

    <div class="hero-section" id="heroContainer">
      <img id="placaImagen" src="" alt="Placa del día" class="placa-imagen" crossorigin="anonymous">
    </div>

    <div class="bottom-section">
      <div class="action-buttons-row">
        <button class="btn-devocional" onclick="toggleDevocional()">Pensamiento Devocional</button>
        <button class="btn-share" onclick="compartirPlaca()">Compartir</button>
      </div>
      <div id="reflexion" class="reflexion-box"></div>
    </div>
  </div>

  <script>
    let devocionalTexto = "";

    async function cargarPlacaDelDia() {
      try {
        const res = await fetch('/api/generar-placa');
        const data = await res.json();
        
        if (data.exito) {
          document.getElementById('placaImagen').src = data.imagenPlacaUrl;
          devocionalTexto = data.devocional;
        }
      } catch (err) {
        console.error("Error al cargar la placa:", err);
      }
    }

    function toggleDevocional() {
      const box = document.getElementById('reflexion');
      if (box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
        box.innerHTML = `<strong>Pensamiento Devocional:</strong> ${devocionalTexto || 'Cargando mensaje...'}`;
      }
    }

    async function compartirPlaca() {
      const imgUrl = document.getElementById('placaImagen').src;
      if (!imgUrl) return;

      try {
        const response = await fetch(imgUrl);
        const blob = await response.blob();
        const file = new File([blob], 'placa-palabra-diaria.png', { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'Palabra Diaria',
            text: 'Te comparto el versículo y mensaje de hoy.',
            files: [file]
          });
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'placa-palabra-diaria.png';
          a.click();
        }
      } catch (err) {
        console.error('Error al compartir la imagen:', err);
        alert('No se pudo compartir la imagen directamente.');
      }
    }
  </script>

</body>
</html>
