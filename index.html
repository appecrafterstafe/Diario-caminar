<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Palabra Diaria</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0a12;
      --surface-dark: #141422;
      --accent-blue: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      background: var(--surface-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (min-width: 500px) {
      .app-container {
        height: 92vh;
        max-height: 860px;
        border-radius: 36px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      }
    }

    /* Header Flotante */
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 0);
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    .app-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn-icon:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.25);
    }

    /* Imagen Hero con Degradado Integrado */
    .hero-section {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg, 
        rgba(10,10,18,0.2) 0%, 
        rgba(10,10,18,0.6) 50%, 
        var(--surface-dark) 100%
      );
      z-index: 2;
    }

    .versiculo-content {
      position: relative;
      z-index: 3;
      text-align: center;
      margin-bottom: 12px;
    }

    .versiculo-imagen {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.45;
      margin-bottom: 14px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }

    .referencia-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .referencia-imagen {
      font-size: 0.9rem;
      color: #60a5fa;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .version-tag {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #e5e7eb;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Botones de Acción e Inferior */
    .bottom-section {
      position: relative;
      z-index: 3;
      padding: 0 20px 24px 20px;
      background: var(--surface-dark);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-buttons-row {
      display: flex;
      gap: 10px;
    }

    .btn-devocional {
      flex: 1;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-devocional:active {
      transform: scale(0.97);
    }

    .btn-share {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 16px 20px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn-share:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.2);
    }

    .reflexion-box {
      padding: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-blue);
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #d1d5db;
      display: none;
      max-height: 160px;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal de Configuración Native Style */
    .config-panel {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 18, 0.95);
      backdrop-filter: blur(20px);
      z-index: 20;
      padding: 40px 24px 24px 24px;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .config-panel h3 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 14px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .form-group select, .form-group input {
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      font-family: inherit;
    }

    .btn-guardar {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      width: 100%;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header Flotante -->
    <div class="top-bar">
      <span class="app-title">Palabra Diaria</span>
      <div class="header-actions">
        <button class="btn-icon" onclick="compartirVersiculo()" title="Compartir">🔗</button>
        <button class="btn-icon" onclick="abrirConfiguracion()" title="Configuración">⚙️</button>
      </div>
    </div>

    <!-- Sección Hero / Imagen -->
    <div class="hero-section">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Fondo" class="bg-image">
      <div class="overlay-gradient"></div>

      <div class="versiculo-content">
        <p class="versiculo-imagen" id="textoVersiculo">"Santifícalos en tu verdad; tu palabra es verdad."</p>
        <div class="referencia-wrapper">
          <span class="referencia-imagen" id="refVersiculo">Juan 17:17</span>
          <span class="version-tag" id="tagVersion">RVR1960</span>
        </div>
      </div>
    </div>

    <!-- Sección Inferior de Acciones -->
    <div class="bottom-section">
      <div class="action-buttons-row">
        <button class="btn-devocional" onclick="obtenerPensamientoDevocional()">Pensamiento Devocional</button>
        <button class="btn-share" onclick="compartirVersiculo()">
          <span>Compartir</span>
        </button>
      </div>
      
      <div id="reflexion" class="reflexion-box"></div>
    </div>

    <!-- Modal Ajustes -->
    <div id="panelConfig" class="config-panel">
      <h3>Ajustes</h3>
      
      <div class="form-group">
        <label for="selectVersion">Traducción Bíblica</label>
        <select id="selectVersion">
          <option value="RVR1960">Reina-Valera 1960 (RVR1960)</option>
          <option value="NBLA">Nueva Biblia de las Américas (NBLA)</option>
          <option value="NTV">Nueva Traducción Viviente (NTV)</option>
          <option value="RVC">Reina Valera Contemporánea (RVC)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="inputHorario">Notificación Diaria</label>
        <input type="time" id="inputHorario" value="07:00">
      </div>

      <button class="btn-guardar" onclick="guardarConfiguracion()">Guardar cambios</button>
    </div>
  </div>

  <script>
    function abrirConfiguracion() {
      document.getElementById('panelConfig').style.display = 'block';
    }

    function guardarConfiguracion() {
      const version = document.getElementById('selectVersion').value;
      document.getElementById('tagVersion').innerText = version;
      document.getElementById('panelConfig').style.display = 'none';

      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission();
      }
      obtenerPensamientoDevocional();
    }

    async function obtenerPensamientoDevocional() {
      const box = document.getElementById('reflexion');
      box.style.display = 'block';
      box.innerHTML = '<em>Cargando devocional...</em>';

      try {
        const respuesta = await fetch('/api/daily-verse');
        const datos = await respuesta.json();
        
        if (datos && datos.contenido) {
          const versionActual = document.getElementById('tagVersion').innerText;
          document.getElementById('textoVersiculo').innerText = datos.contenido.traducciones[versionActual] || datos.contenido.traducciones['RVR1960'];
          document.getElementById('refVersiculo').innerText = datos.contenido.referencia;
          box.innerHTML = `<strong>Pensamiento Devocional:</strong> ${datos.contenido.devocional}`;
        }
      } catch (error) {
        box.innerHTML = '<strong>Pensamiento Devocional:</strong> Antes de ir a la cruz, Jesús oró pidiéndole al Padre que guarde y aparte a sus seguidores del mal. La verdadera transformación no depende de nuestras propias fuerzas, sino de conocer y obedecer lo que Dios ha dicho.';
      }
    }

    async function compartirVersiculo() {
      const texto = document.getElementById('textoVersiculo').innerText;
      const referencia = document.getElementById('refVersiculo').innerText;
      const version = document.getElementById('tagVersion').innerText;
      
      const mensaje = `${texto}\n— ${referencia} (${version})\n\nCompartido desde Palabra Diaria`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Versículo del Día',
            text: mensaje,
            url: window.location.href
          });
        } catch (err) {
          console.log('Compartir cancelado');
        }
      } else {
        // Fallback para navegadores que no soportan Web Share API
        navigator.clipboard.writeText(mensaje);
        alert('¡Versículo copiado al portapapeles!');
      }
    }
  </script>

</body>
</html>
