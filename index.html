<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Palabra Diaria</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f0f17;
      --card-bg: rgba(25, 25, 38, 0.85);
      --accent-blue: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Contenedor adaptativo: Fullscreen en Android/Móvil, Card en Desktop */
    .app-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      background: #13131c;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (min-width: 500px) {
      .app-container {
        height: 90vh;
        max-height: 840px;
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
    }

    /* Barra Superior Estilo Android App */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 5;
    }

    .app-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-icon:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.18);
    }

    /* Área Principal con Imagen Completa */
    .hero-section {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15,15,23,0.3) 0%, rgba(15,15,23,0.7) 50%, #13131c 100%);
      z-index: 2;
    }

    .versiculo-content {
      position: relative;
      z-index: 3;
      text-align: center;
      margin-bottom: 20px;
    }

    .versiculo-imagen {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .referencia-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .referencia-imagen {
      font-size: 0.9rem;
      color: #60a5fa;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .version-tag {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #e5e7eb;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Panel Inferior de Contenido y Botones */
    .bottom-section {
      position: relative;
      z-index: 3;
      padding: 0 24px 24px 24px;
      background: #13131c;
    }

    .btn-devocional {
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-devocional:active {
      transform: scale(0.98);
    }

    .reflexion-box {
      margin-top: 16px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-blue);
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #d1d5db;
      display: none;
      max-height: 180px;
      overflow-y: auto;
    }

    /* Modal Ajustes Android */
    .config-panel {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 23, 0.96);
      backdrop-filter: blur(12px);
      z-index: 10;
      padding: 32px 24px;
    }

    .config-panel h3 {
      font-size: 1.3rem;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group select, .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .btn-guardar {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 14px;
      width: 100%;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <span class="app-title">Palabra Diaria</span>
      <button class="btn-icon" onclick="abrirConfiguracion()" aria-label="Configuración">⚙️</button>
    </div>

    <div class="hero-section">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Fondo" class="bg-image">
      <div class="overlay-gradient"></div>

      <div class="versiculo-content">
        <p class="versiculo-imagen" id="textoVersiculo">"Santifícalos en tu verdad; tu palabra es verdad."</p>
        <div class="referencia-wrapper">
          <span class="referencia-imagen" id="refVersiculo">Juan 17:17</span>
          <span class="version-tag" id="tagVersion">RVR1960</span>
        </div>
      </div>
    </div>

    <div class="bottom-section">
      <button class="btn-devocional" onclick="obtenerPensamientoDevocional()">Pensamiento Devocional</button>
      <div id="reflexion" class="reflexion-box"></div>
    </div>

    <div id="panelConfig" class="config-panel">
      <h3>Ajustes</h3>
      
      <div class="form-group">
        <label for="selectVersion">Traducción Bíblica</label>
        <select id="selectVersion">
          <option value="RVR1960">Reina-Valera 1960 (RVR1960)</option>
          <option value="NBLA">Nueva Biblia de las Américas (NBLA)</option>
          <option value="NTV">Nueva Traducción Viviente (NTV)</option>
          <option value="RVC">Reina Valera Contemporánea (RVC)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="inputHorario">Notificación Diaria</label>
        <input type="time" id="inputHorario" value="07:00">
      </div>

      <button class="btn-guardar" onclick="guardarConfiguracion()">Guardar cambios</button>
    </div>
  </div>

  <script>
    function abrirConfiguracion() {
      document.getElementById('panelConfig').style.display = 'block';
    }

    function guardarConfiguracion() {
      const version = document.getElementById('selectVersion').value;
      document.getElementById('tagVersion').innerText = version;
      document.getElementById('panelConfig').style.display = 'none';

      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission();
      }
      obtenerPensamientoDevocional();
    }

    async function obtenerPensamientoDevocional() {
      const box = document.getElementById('reflexion');
      box.style.display = 'block';
      box.innerHTML = '<em>Cargando devocional...</em>';

      try {
        const respuesta = await fetch('/api/daily-verse');
        const datos = await respuesta.json();
        
        if (datos && datos.contenido) {
          const versionActual = document.getElementById('tagVersion').innerText;
          document.getElementById('textoVersiculo').innerText = datos.contenido.traducciones[versionActual] || datos.contenido.traducciones['RVR1960'];
          document.getElementById('refVersiculo').innerText = datos.contenido.referencia;
          box.innerHTML = `<strong>Pensamiento Devocional:</strong> ${datos.contenido.devocional}`;
        }
      } catch (error) {
        box.innerHTML = '<strong>Pensamiento Devocional:</strong> Antes de ir a la cruz, Jesús oró pidiéndole al Padre que guarde y aparte a sus seguidores del mal. La verdadera transformación no depende de nuestras propias fuerzas, sino de conocer y obedecer lo que Dios ha dicho.';
      }
    }
  </script>

</body>
</html>
